services:
  opspilot:
    build: .
    container_name: opspilot
    environment:
      RUNTIME_MODE: docker
      DATABASE_PATH: /app/data/opspilot.db
      MONITORED_SERVICES: nginx,redis,api-service
      MONITOR_INTERVAL_SECONDS: 5
      AUTO_REMEDIATE: "true"
      ENABLE_BACKGROUND_MONITOR: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
      - redis
      - api-service
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "8088:80"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

  api-service:
    build: ./demo_service
    container_name: api-service
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: opspilot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - opspilot
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opspilot-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: opspilot-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: opspilot
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

